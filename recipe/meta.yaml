{% set python_min = "3.10" %}
{% set name = "mudata" %}
{% set version = "0.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mudata-{{ version }}.tar.gz
  sha256: 24e9d7638dc4bc8305370ce89f514217ec8ffa8188126327dde9a17ef6687fdf

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
  run:
    - scipy
    - scverse-misc >=0.1.1
    - anndata >=0.11
    - h5py
    - numpy
    - pandas >=1.4
    - python >={{ python_min }}
    - session-info2

test:
  imports:
    - mudata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/scverse/mudata
  summary: Multimodal annotated datasets
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ilia-kats
    - ilan-gold
    - flying-sheep
    - ivirshup
    - grst
    - gtca
